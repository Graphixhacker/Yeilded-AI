    <script>
      (function() {
        try {
          var mode = localStorage.getItem('mun_theme_mode');
          if (!mode) {
            var old = localStorage.getItem('mun_dark_mode');
            if (old !== null) mode = old === 'true' ? 'dark' : 'light';
            else mode = 'system';
          }
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
